# The HTTP contract between a frontend and its API. Every API stack implements it, whatever its
# language, and proves it by passing the conformance suite (src/conformance.ts); every frontend
# calls it through the client generated from this file (src/schema.ts, `pnpm generate`).
# Change the API here first, then in each stack.
#
# An operation that belongs to a module (payments, jobs, ...) names it with
# `x-clubedge-module: <id>`. A project without that module has no such endpoint, so its API
# answers 404 not_found as for any unknown path; the conformance suite checks both cases.
openapi: 3.1.0
info:
  title: Clubedge API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness. Checks nothing, so it answers while the database is down.
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/ready:
    get:
      operationId: getReady
      summary: Readiness. Ready when the database answers. Never cached.
      responses:
        "200":
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: Not ready, for example while the database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
  /api/session:
    get:
      operationId: getSession
      summary: The signed-in user, or null.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /api/client-errors:
    get:
      operationId: getBrowserErrorReporting
      summary: How the browser reports its errors, read at runtime so builds never bake it in.
      x-clubedge-module: observability
      responses:
        "200":
          description: Post errors back here, send them to Sentry, or do not report them.
          headers:
            Cache-Control:
              description: no-store, so a new setting applies on the next page load.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserErrorReporting"
    post:
      operationId: reportBrowserError
      summary: Reports an error from the browser like a server error. 30 a minute per address.
      x-clubedge-module: observability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "204":
          description: Reported.
        "400":
          description: Not an error report (code invalid_report).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/jobs:
    get:
      operationId: getJobsStatus
      summary: How jobs run, and the current user's recent sample jobs. Never cached.
      x-clubedge-module: jobs
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: >-
            The runner, and the sample jobs queued by the signed-in user (or by anyone signed
            out), newest first; jobs is null when the queue could not be read.
          headers:
            Cache-Control:
              description: no-store, so each page load lists the jobs as they are.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsStatus"
  /api/jobs/sample:
    post:
      operationId: runSampleJob
      summary: Queues the sample job for the current user; repeats within seconds are ignored.
      x-clubedge-module: jobs
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Queued, or ignored as a repeat (id null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleJobQueued"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          description: The queue could not be reached (code unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/jobs/run:
    get:
      operationId: runDueJobs
      summary: >-
        Runs the jobs that are due, for a scheduler where no worker runs. Only providers that
        run jobs in the API (pg-boss, BullMQ) have it.
      x-clubedge-module: jobs
      security:
        - cronSecret: []
      responses:
        "200":
          description: The jobs that finished, and the attempts that failed, retries included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueJobsRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: CRON_SECRET is not set, so no scheduler may run jobs (code not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/inngest:
    get:
      operationId: inspectInngest
      summary: Inngest's protocol (opaque here); only the Inngest provider has it.
      x-clubedge-module: jobs
      responses:
        default:
          description: Inngest reads the app's jobs. The SDK defines the answer.
    put:
      operationId: syncInngest
      summary: Inngest's protocol (opaque here); only the Inngest provider has it.
      x-clubedge-module: jobs
      responses:
        default:
          description: Registers the app's jobs with Inngest. The SDK defines the answer.
    post:
      operationId: runInngestJob
      summary: >-
        Inngest's protocol (opaque here): Inngest calls it to run a job, signed with the signing
        key. Only the Inngest provider has it.
      x-clubedge-module: jobs
      responses:
        default:
          description: The job's result. The SDK defines the answer.
components:
  # Answers that module operations share, each with its Error code.
  responses:
    Unauthorized:
      description: Not signed in (code unauthorized).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotConfigured:
      description: The module's provider is not configured on this server (code not_configured).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many requests from this client (code rate_limited).
      headers:
        Retry-After:
          description: Seconds until the client may try again.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The request body is over the operation's limit (code payload_too_large).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: >-
        The body is not JSON (code unsupported_media_type). Mutating operations take only JSON,
        which another site cannot make a browser send without the API's CORS approval.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cronSecret:
      type: http
      scheme: bearer
      description: The API's CRON_SECRET.
  schemas:
    Health:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          description: The project's service id, from the API's site config.
        timestamp:
          type: string
          format: date-time
    Ready:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Session:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: [string, "null"]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable and machine-readable, such as not_found.
            message:
              type: string
    BrowserErrorReporting:
      oneOf:
        - type: object
          description: Post errors to /api/client-errors.
          required: [provider]
          properties:
            provider:
              type: string
              enum: [endpoint]
        - type: object
          description: Send errors to Sentry with its browser SDK; a DSN is public by design.
          required: [provider, dsn]
          properties:
            provider:
              type: string
              enum: [sentry]
            dsn:
              type: string
            environment:
              type: string
            release:
              type: string
        - type: object
          description: Do not report browser errors.
          required: [provider]
          properties:
            provider:
              type: string
              enum: [none]
    ClientErrorReport:
      type: object
      description: An uncaught error, an unhandled rejection, or a render error a boundary caught.
      required: [kind, name, message, path]
      properties:
        kind:
          type: string
          enum: [error, unhandledrejection, render]
        name:
          type: string
        message:
          type: string
        stack:
          type: string
        path:
          type: string
          description: The page's path, without its query string.
    JobsStatus:
      type: object
      required: [runner, jobs]
      properties:
        runner:
          type: string
          description: >-
            Where jobs run: the API's own worker, a scheduler calling /api/jobs/run, or a jobs
            service (Inngest) calling the API.
          enum: [worker, scheduler, service]
        jobs:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/JobRun"
            - type: "null"
    JobRun:
      type: object
      required: [id, name, state, createdAt, completedAt]
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [queued, active, retrying, completed, failed, cancelled]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    SampleJobQueued:
      type: object
      required: [id]
      properties:
        id:
          type: [string, "null"]
          description: The queued job's id, or null when a repeat was ignored.
    DueJobsRun:
      type: object
      required: [completed, failed]
      properties:
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
