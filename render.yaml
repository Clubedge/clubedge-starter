# Render Blueprint (https://render.com/docs/blueprint-spec). Create it from the dashboard with
# New > Blueprint; Render asks for every variable marked sync: false.
services:
  - type: web
    name: app
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Applies migrations before each deploy goes live. Pre-deploy commands need a paid instance
    # type; on the free type, remove this line and migrate before deploying (see SETUP.md).
    preDeployCommand: node /app/migrate.mjs
    envVars:
      - key: DATABASE_URL
        sync: false
      # Cloudflare, in front of every Render service, puts each client's address in
      # CF-Connecting-IP and refuses requests that send their own; Render's X-Forwarded-For keeps
      # the entries a client sent. Rate limits read the address there; see SETUP.md.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: NEXT_PUBLIC_APP_URL # clubedge:only framework=next
        sync: false # clubedge:only framework=next
      - key: APP_URL # clubedge:only framework=tanstack-start
        sync: false # clubedge:only framework=tanstack-start
      # clubedge:if auth=supabase && framework=next
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # clubedge:end
      # clubedge:if auth=supabase && framework=tanstack-start
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # clubedge:end
      # clubedge:if auth=better-auth
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # clubedge:end
      # clubedge:if auth=supabase
      # Optional: lets users delete their account from the settings page.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # clubedge:end
      # clubedge:if auth=firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # clubedge:end
      # clubedge:if auth=appwrite
      - key: APPWRITE_ENDPOINT
        sync: false
      - key: APPWRITE_PROJECT_ID
        sync: false
      - key: APPWRITE_API_KEY
        sync: false
      # clubedge:end
      # clubedge:if email=smtp
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      # clubedge:end
      # clubedge:if email=resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # clubedge:end
      # clubedge:if payments=stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      # clubedge:end
      # clubedge:if cache=redis
      - key: REDIS_URL
        sync: false
      # clubedge:end
      # clubedge:if storage=s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      # clubedge:end
      # clubedge:if storage=supabase
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      # clubedge:end
      # clubedge:if jobs=inngest
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      # clubedge:end
      # clubedge:if observability=otel
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # clubedge:end
      # clubedge:if observability=sentry
      - key: SENTRY_DSN
        sync: false
      # clubedge:end
