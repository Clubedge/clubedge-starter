# Fly.io (https://fly.io/docs/reference/configuration/). `fly launch --no-deploy` creates the app
# and adds its name and region here; set secrets with `fly secrets set`, then run `fly deploy`.
[build]
  dockerfile = "Dockerfile"
  # Next.js compiles NEXT_PUBLIC_APP_URL into the build (sign-in links, Stripe return URLs), so a
  # Next.js app sets it here rather than as a secret:
  # [build.args]
  #   NEXT_PUBLIC_APP_URL = "https://<app>.fly.dev"

# Runs in a temporary machine with the new image before it replaces the running one.
[deploy]
  release_command = "node /app/migrate.mjs"

# Fly's proxy puts each client's address in Fly-Client-IP (the last X-Forwarded-For entry is the
# app's own address), so rate limits read it there; see SETUP.md.
[env]
  CLIENT_IP_HEADER = "fly-client-ip"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
