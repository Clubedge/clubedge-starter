# Maintainer checks for the Starter repository. Generated projects only receive ci.yml, which
# covers their single app; this workflow covers the second framework and module combinations.
name: Starter
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cli-ref:
        description: create-clubedge-app branch or tag used to generate projects
        default: main
permissions:
  contents: read
env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  UV_LOCKED: "1"
jobs:
  # Unit tests on Windows: the local database server, folder storage (junctions instead of
  # symlinks), and scripts must work for developers on Windows too.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Python apps (the FastAPI API) run their checks with uv.
      - uses: astral-sh/setup-uv@v10.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # The Appwrite provider against Appwrite Cloud: the auth conformance suite on the Starter's test
  # project, which removes the users it creates. Pull requests from forks get no secrets, so there
  # it skips; the suite against node-appwrite's stand-in runs in every test run.
  appwrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
    steps:
      - name: Skip without the Appwrite test project
        if: env.APPWRITE_API_KEY == ''
        run: echo "::notice::APPWRITE_* secrets are not available here; the live Appwrite suite is skipped."
      - uses: actions/checkout@v7
        if: env.APPWRITE_API_KEY != ''
      - uses: pnpm/action-setup@v6
        if: env.APPWRITE_API_KEY != ''
      - uses: actions/setup-node@v7
        if: env.APPWRITE_API_KEY != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.APPWRITE_API_KEY != ''
      - name: Run the auth conformance suite against Appwrite Cloud
        if: env.APPWRITE_API_KEY != ''
        run: pnpm exec vitest run packages/auth-appwrite/src/conformance.live.test.ts

  tanstack-start:
    runs-on: ubuntu-24.04
    env:
      E2E_APP: start
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: cp apps/start/.env.example apps/start/.env.local
      - run: pnpm --filter @clubedge/start build
      - name: Serve the production build
        run: |
          set -euo pipefail
          pnpm --filter @clubedge/start start > "$RUNNER_TEMP/app.log" 2>&1 &
          trap 'tail -n 50 "$RUNNER_TEMP/app.log"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          for path in / /login /dashboard /api/health; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:3000$path"
          done
      # Failed browser tests: print each one's page snapshot here and keep traces and screenshots.
      - name: Show why browser tests failed
        if: failure()
        run: |
          find test-results -name error-context.md 2>/dev/null | while read -r file; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-tanstack-start
          path: test-results
          if-no-files-found: ignore

  tanstack-start-docker:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: >-
          docker build --tag app:ci --file apps/start/Dockerfile
          --build-arg APP_DIR=apps/start --build-arg APP_PACKAGE=@clubedge/start .
      - name: Run the image's migrations twice; the second run changes nothing
        run: |
          set -euo pipefail
          for run in 1 2; do
            docker run --rm --network host               --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/app               app:ci node /app/migrate.mjs
          done
          PGPASSWORD=postgres psql --host 127.0.0.1 --username postgres --dbname app             --command "select count(*) from public.users"
      - name: Start the image and check health
        run: |
          set -euo pipefail
          docker run --detach --name app --publish 3000:3000 --env DATABASE_URL="$DATABASE_URL" app:ci
          trap 'docker logs app; docker rm --force app' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The container did not become healthy."
          exit 1

  # Generates a project per deployment platform and checks the fields that matter in its config.
  # TanStack Start projects for serverless platforms also build with that platform's preset. The
  # image's migrator itself is exercised by the docker jobs.
  deploy-config:
    name: deploy-config (${{ matrix.deploy }}, ${{ matrix.framework }}, ${{ matrix.api || 'none' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { deploy: docker, framework: next, auth: better-auth }
          - { deploy: fly, framework: next, auth: better-auth }
          - { deploy: railway, framework: next, auth: better-auth }
          - { deploy: render, framework: next, auth: better-auth }
          - { deploy: vercel, framework: next, auth: better-auth }
          - { deploy: vercel, framework: tanstack-start, auth: better-auth }
          - { deploy: netlify, framework: next, auth: better-auth }
          - { deploy: netlify, framework: tanstack-start, auth: better-auth }
          - { deploy: docker, framework: vite, api: hono, auth: supabase }
          - {
              deploy: railway,
              framework: vite,
              api: hono,
              auth: supabase,
              modules: --payments stripe,
            }
          - { deploy: docker, framework: vite, api: fastapi, auth: supabase }
          - { deploy: railway, framework: vite, api: fastapi, auth: supabase }
    env:
      CLI_REF: ${{ inputs.cli-ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build create-clubedge-app
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$CLI_REF" https://github.com/Clubedge/create-clubedge-app.git "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Generate the project
        run: |
          node "$RUNNER_TEMP/cli/bin/create.mjs" "$RUNNER_TEMP/app" --template-dir "$GITHUB_WORKSPACE"             --framework ${{ matrix.framework }} --deploy ${{ matrix.deploy }} --auth ${{ matrix.auth }} ${{ matrix.api && format('--api {0}', matrix.api) || '' }} ${{ matrix.modules }}             --no-git --no-install --yes
      - name: Check the platform config
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          configs="fly.toml .railway/railway.ts render.yaml apps/web/vercel.json apps/web/netlify.toml"
          ! grep -n "clubedge:" $configs 2>/dev/null
          # Only the selected platform's file is present.
          for config in $configs; do
            case "$config" in
              *fly.toml) want=fly ;; *railway.ts) want=railway ;; *render.yaml) want=render ;;
              *vercel.json) want=vercel ;; *netlify.toml) want=netlify ;;
            esac
            if [ "$want" = "${{ matrix.deploy }}" ]; then test -f "$config"; else test ! -e "$config"; fi
          done
          if [ -n "${{ matrix.api }}" ]; then
            python3 - <<'PY'
          import json
          services = json.load(open("package.json", encoding="utf-8"))["clubedge"]["services"]
          assert services["framework"]["role"] == "frontend"
          assert services["framework"]["id"] == "web"
          assert services["api"]["role"] == "api"
          assert services["api"]["id"] == "api"
          assert services["api"]["dockerfile"] == f"apps/api/Dockerfile"
          PY
          fi
          case "${{ matrix.deploy }}" in
            fly)
              python3 - <<'PY'
          import tomllib
          config = tomllib.load(open("fly.toml", "rb"))
          assert config["deploy"]["release_command"] == "node /app/migrate.mjs"
          assert config["http_service"]["checks"][0]["path"] == "/api/health"
          PY
              ;;
            railway)
              # Railway's configuration as code, which replaced railway.json; Railway builds the root Dockerfile.
              test ! -e railway.json
              test -f Dockerfile
              grep -q 'from "railway/iac"' .railway/railway.ts
              grep -q 'preDeploy: "node /app/migrate.mjs"' .railway/railway.ts
              grep -q 'healthcheck: "/api/health"' .railway/railway.ts
              grep -q 'healthcheckTimeout: 60' .railway/railway.ts
              ;;
            render)
              python3 - <<'PY'
          import yaml
          service = yaml.safe_load(open("render.yaml"))["services"][0]
          assert service["preDeployCommand"] == "node /app/migrate.mjs"
          assert service["healthCheckPath"] == "/api/health"
          keys = {variable["key"] for variable in service["envVars"]}
          assert {"DATABASE_URL", "BETTER_AUTH_SECRET", "NEXT_PUBLIC_APP_URL"} <= keys, keys
          assert "SUPABASE_URL" not in keys and "NEXT_PUBLIC_SUPABASE_URL" not in keys, keys
          PY
              ;;
            vercel)
              FRAMEWORK=${{ matrix.framework }} python3 - <<'PY'
          import json, os
          config = json.load(open("apps/web/vercel.json"))
          expected = "nextjs" if os.environ["FRAMEWORK"] == "next" else None
          assert config["framework"] == expected, config
          assert config["buildCommand"].startswith("pnpm run check:env && pnpm --dir ../.. db:migrate && "), config
          PY
              ;;
            netlify)
              python3 - <<'PY'
          import tomllib
          build = tomllib.load(open("apps/web/netlify.toml", "rb"))["build"]
          assert build["command"].startswith("pnpm run check:env && pnpm --dir ../.. db:migrate && "), build
          assert build["publish"], build
          PY
              ;;
          esac
          # Full-stack apps check their own environment schema; Vite delegates to its API.
          if [ "${{ matrix.framework }}" = vite ]; then env_schema=apps/api/.env.example; else env_schema=apps/web/src/env/production.ts; fi
          ! grep -n "clubedge:" "$env_schema"
          grep -q '"check:env"' apps/web/package.json
          case "${{ matrix.auth }}" in
            better-auth)
              grep -q 'BETTER_AUTH_SECRET' "$env_schema"
              ! grep -q 'SUPABASE' "$env_schema"
              ;;
            supabase)
              grep -q 'SUPABASE_URL' "$env_schema"
              grep -q 'SUPABASE_PUBLISHABLE_KEY' "$env_schema"
              ! grep -q 'BETTER_AUTH_SECRET' "$env_schema"
              ;;
          esac
          # A frontend and its API: the API's module variables go to the API only.
          if [ -n "${{ matrix.api }}" ] && [[ "${{ matrix.modules }}" == *"--payments stripe"* ]]; then
            grep -q '^STRIPE_SECRET_KEY=' apps/api/.env.example
            grep -q '^STRIPE_WEBHOOK_SECRET=' apps/api/.env.example
            grep -q '^STRIPE_PRICE_PRO=' apps/api/.env.example
            for frontend in apps/web/.env.example .env.example; do
              if [ -e "$frontend" ] && grep -n 'STRIPE_' "$frontend"; then
                echo "$frontend has the API's Stripe variables."
                exit 1
              fi
            done
          fi
      - name: Lint the deploy workflow
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          bash <(curl --fail --silent --show-error https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/deploy.yml
          ! grep -n "clubedge:" .github/workflows/deploy.yml
          # Exactly one job: the selected platform's.
          test "$(grep -cE '^  [a-z]+:$' .github/workflows/deploy.yml)" = 1
      - name: Build with the platform's preset
        if: matrix.framework == 'tanstack-start'
        working-directory: ${{ runner.temp }}/app
        env:
          NITRO_PRESET: ${{ matrix.deploy }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @clubedge/web build
          if [ "${{ matrix.deploy }}" = vercel ]; then
            test -f apps/web/.vercel/output/config.json
          else
            test -d apps/web/.netlify/functions-internal/server
            test -d apps/web/dist
          fi

  # Generates projects from this checkout with create-clubedge-app and runs their full pipeline.
  generated-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: next-default, framework: next, modules: "" }
          - {
              name: next-minimal,
              framework: next,
              modules: --auth none --storage none --cache memory --email none,
            }
          - {
              name: next-supabase-storage,
              framework: next,
              modules: --storage supabase --cache memory --jobs pg-boss --observability otel,
            }
          - { name: start-default, framework: tanstack-start, modules: "" }
          - {
              name: start-minimal,
              framework: tanstack-start,
              modules: --auth none --storage none --cache memory --email none,
            }
          - {
              name: start-supabase-storage,
              framework: tanstack-start,
              modules: --storage supabase --observability sentry,
            }
          - {
              name: next-better-auth,
              framework: next,
              modules: --auth better-auth --storage none --email resend,
            }
          - {
              name: start-better-auth,
              framework: tanstack-start,
              modules: --auth better-auth --cache memory --jobs pg-boss,
            }
          # A frontend and a separate API, joined by packages/contract.
          - { name: vite-hono, framework: vite, modules: --auth none --api hono }
          - {
              name: vite-hono-minimal,
              framework: vite,
              modules: --auth none --api hono --storage none --cache memory --email none,
            }
          # Every module the API implements, on its providers' code paths.
          - {
              name: vite-hono-modules-a,
              framework: vite,
              modules: --api hono --auth better-auth --storage s3 --cache redis --observability otel --payments stripe --jobs pg-boss,
            }
          - {
              name: vite-hono-modules-b,
              framework: vite,
              modules: --api hono --auth supabase --storage supabase --observability sentry --jobs inngest,
            }
          - {
              name: vite-hono-bullmq,
              framework: vite,
              modules: --api hono --auth firebase --cache redis --jobs bullmq --payments stripe,
            }
          - {
              name: vite-fastapi-modules-a,
              framework: vite,
              modules: --api fastapi --auth better-auth --storage s3 --email smtp,
            }
          - {
              name: vite-fastapi-modules-b,
              framework: vite,
              modules: --api fastapi --auth supabase --storage supabase,
            }
          - { name: vite-fastapi, framework: vite, modules: --auth none --api fastapi }
          - { name: vite-hono-supabase, framework: vite, modules: --auth supabase --api hono }
          - { name: vite-fastapi-supabase, framework: vite, modules: --auth supabase --api fastapi }
          - { name: vite-hono-better-auth, framework: vite, modules: --auth better-auth --api hono }
          - {
              name: vite-hono-resend,
              framework: vite,
              modules: --auth better-auth --api hono --email resend,
            }
          - {
              name: vite-fastapi-resend,
              framework: vite,
              modules: --auth better-auth --api fastapi --email resend,
            }
          - {
              name: vite-fastapi-better-auth,
              framework: vite,
              modules: --auth better-auth --api fastapi,
            }
          - { name: vite-hono-firebase, framework: vite, modules: --auth firebase --api hono }
          - { name: vite-fastapi-firebase, framework: vite, modules: --auth firebase --api fastapi }
          - { name: vite-hono-appwrite, framework: vite, modules: --auth appwrite --api hono }
          - { name: vite-fastapi-appwrite, framework: vite, modules: --auth appwrite --api fastapi }
    name: generated-project (${{ matrix.name }})
    env:
      CLI_REF: ${{ inputs.cli-ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Python apps (the FastAPI API) run their checks with uv.
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build create-clubedge-app
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$CLI_REF" https://github.com/Clubedge/create-clubedge-app.git "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Generate the project
        run: |
          node "$RUNNER_TEMP/cli/bin/create.mjs" "$RUNNER_TEMP/generated-app" --template-dir "$GITHUB_WORKSPACE" \
            --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-git --no-install --yes
      # FastAPI does not implement every module option yet, so the CLI must refuse the others
      # rather than generate a frontend that calls endpoints its API lacks.
      - name: Refuse modules FastAPI does not implement
        if: matrix.name == 'vite-fastapi'
        run: |
          set -euo pipefail
          for option in "--cache redis" "--payments stripe" \
            "--jobs pg-boss" "--observability otel"; do
            if node "$RUNNER_TEMP/cli/bin/create.mjs" "$RUNNER_TEMP/refused" \
              --template-dir "$GITHUB_WORKSPACE" --framework vite --api fastapi $option \
              --no-git --no-install --yes > "$RUNNER_TEMP/refused.log" 2>&1; then
              echo "The CLI generated a FastAPI project with $option."
              exit 1
            fi
            grep -q "FastAPI (Python) does not implement" "$RUNNER_TEMP/refused.log" \
              || { cat "$RUNNER_TEMP/refused.log"; exit 1; }
            test ! -e "$RUNNER_TEMP/refused"
          done
      - name: Install
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, and test
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Start Firebase Auth Emulator
        if: contains(matrix.modules, '--auth firebase')
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          nohup npx --yes firebase-tools@15 emulators:start --only auth --project demo-clubedge \
            > "$RUNNER_TEMP/firebase.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --silent --output /dev/null http://127.0.0.1:9099/ && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/firebase.log"
          exit 1
      - name: Browser checks
        working-directory: ${{ runner.temp }}/generated-app
        env:
          E2E_AUTH_ENABLED: ${{ contains(matrix.modules, '--auth firebase') || (matrix.framework == 'vite' && contains(matrix.modules, '--auth better-auth')) }}
          FIREBASE_PROJECT_ID: demo-clubedge
          FIREBASE_API_KEY: fake-api-key
          FIREBASE_AUTH_EMULATOR_HOST: ${{ contains(matrix.modules, '--auth firebase') && '127.0.0.1:9099' || '' }}
          VITE_FIREBASE_PROJECT_ID: demo-clubedge
          VITE_FIREBASE_API_KEY: fake-api-key
          VITE_FIREBASE_AUTH_DOMAIN: localhost
          VITE_FIREBASE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Show Firebase emulator log on failure
        if: failure() && contains(matrix.modules, '--auth firebase')
        run: tail -n 100 "$RUNNER_TEMP/firebase.log" || true
      - name: Build, start, and smoke-test
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          set -euo pipefail
          pnpm build
          pnpm start > "$RUNNER_TEMP/app.log" 2>&1 &
          trap 'tail -n 50 "$RUNNER_TEMP/app.log"' EXIT
          node "$GITHUB_WORKSPACE/scripts/smoke-generated-app.mjs"
      # Pages that need no database must keep working when it is not configured, so a mistake
      # in the environment never takes the whole app down at startup.
      - name: Serve pages without a database configured
        # A frontend and its API each need their own port, which one PORT can't give them.
        if: ${{ !contains(matrix.modules, '--api') }}
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          set -euo pipefail
          DATABASE_URL= PORT=3100 pnpm start > "$RUNNER_TEMP/no-database.log" 2>&1 &
          trap 'tail -n 50 "$RUNNER_TEMP/no-database.log"' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:3100/api/health && break
            sleep 1
          done
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3100/api/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3100/
      # Failed browser tests: print each one's page snapshot here and keep traces and screenshots.
      - name: Show why browser tests failed
        if: failure()
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          find test-results -name error-context.md 2>/dev/null | while read -r file; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-generated-project-${{ matrix.name }}
          path: ${{ runner.temp }}/generated-app/test-results
          if-no-files-found: ignore

  # Exercises Firebase email verification and API token validation against its local Auth Emulator.
  firebase-flow:
    name: firebase-flow (${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [hono, fastapi]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLI_REF: ${{ inputs.cli-ref || 'main' }}
      FIREBASE_PROJECT_ID: demo-clubedge
      FIREBASE_API_KEY: fake-api-key
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      VITE_FIREBASE_PROJECT_ID: demo-clubedge
      VITE_FIREBASE_API_KEY: fake-api-key
      VITE_FIREBASE_AUTH_DOMAIN: 127.0.0.1
      VITE_FIREBASE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build create-clubedge-app
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$CLI_REF" https://github.com/Clubedge/create-clubedge-app.git "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Generate the project
        run: |
          node "$RUNNER_TEMP/cli/bin/create.mjs" "$RUNNER_TEMP/generated-app" --template-dir "$GITHUB_WORKSPACE" \
            --framework vite --api "${{ matrix.api }}" --auth firebase --infra none --no-git --no-install --yes
      - name: Install dependencies and prepare the API
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm install --frozen-lockfile
          if [ "${{ matrix.api }}" = fastapi ]; then (cd apps/api && uv sync --locked); fi
          pnpm db:migrate
      - name: Start Firebase Auth Emulator
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          nohup npx --yes firebase-tools@15 emulators:start --only auth --project demo-clubedge \
            > "$RUNNER_TEMP/firebase.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --silent --output /dev/null http://127.0.0.1:9099/ && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/firebase.log"
          exit 1
      - name: Verify email, sign in, and validate the API session
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e e2e/firebase-auth-flow.spec.ts
      - name: Show emulator log on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/firebase.log" || true

  # Signs up, out, and back in through the real forms, with Better Auth on PostgreSQL.
  better-auth-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: next, api: none }
          - { framework: tanstack-start, api: none }
          - { framework: vite, api: hono }
          - { framework: vite, api: fastapi }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLI_REF: ${{ inputs.cli-ref || 'main' }}
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3000
      E2E_AUTH_FLOW: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build create-clubedge-app
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$CLI_REF" https://github.com/Clubedge/create-clubedge-app.git "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Generate the project
        run: |
          node "$RUNNER_TEMP/cli/bin/create.mjs" "$RUNNER_TEMP/generated-app" --template-dir "$GITHUB_WORKSPACE" \
            --framework ${{ matrix.framework }} --api ${{ matrix.api }} --auth better-auth --infra none --no-git --no-install --yes
      - name: Install and migrate
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm install --frozen-lockfile
          if [ "${{ matrix.api }}" = fastapi ]; then (cd apps/api && uv sync --locked); fi
          pnpm db:migrate
      - name: Sign up, sign out, and sign in through the selected stack
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e e2e/auth-flow.spec.ts
      # Failed browser tests: print each one's page snapshot here and keep traces and screenshots.
      - name: Show why browser tests failed
        if: failure()
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          find test-results -name error-context.md 2>/dev/null | while read -r file; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-better-auth-flow-${{ matrix.framework }}-${{ matrix.api }}
          path: ${{ runner.temp }}/generated-app/test-results
          if-no-files-found: ignore

  # Generates projects with local infrastructure, starts it, and proves the app uses it: service
  # round trips through `pnpm check:services` and a real sign-up, sign-out, and sign-in.
  local-infra:
    name: local-infra (${{ matrix.infra }}, ${{ matrix.framework }}, ${{ matrix.api || 'none' }}, ${{ matrix.modules }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # mail-api is the local inbox the browser tests read emails from; local mode has none,
          # because it prints emails to the log.
          - {
              infra: docker,
              framework: next,
              modules: --auth better-auth --payments stripe --jobs pg-boss --observability otel,
              mail-api: "http://127.0.0.1:8025",
            }
          - {
              infra: docker,
              framework: tanstack-start,
              modules: --auth better-auth --payments stripe --jobs pg-boss --observability sentry,
              mail-api: "http://127.0.0.1:8025",
            }
          # Firebase Authentication through its Auth Emulator; its emails go to Mailpit.
          - {
              infra: docker,
              framework: next,
              modules: --auth firebase --jobs pg-boss,
              mail-api: "http://127.0.0.1:8025",
            }
          # The other jobs providers: BullMQ on the Docker Redis, and Inngest through its Dev Server.
          - {
              infra: docker,
              framework: next,
              modules: --auth better-auth --jobs bullmq,
              mail-api: "http://127.0.0.1:8025",
            }
          - {
              infra: docker,
              framework: tanstack-start,
              modules: --auth better-auth --jobs inngest,
              mail-api: "http://127.0.0.1:8025",
            }
          - {
              infra: local,
              framework: next,
              modules: --auth better-auth --jobs pg-boss --observability sentry,
              mail-api: "",
            }
          - {
              infra: local,
              framework: tanstack-start,
              modules: --auth better-auth --jobs pg-boss --observability otel,
              mail-api: "",
            }
          # A real hosted database: an unclaimed Neon database, which needs no account or secret
          # and expires by itself after 72 hours.
          - {
              infra: neon,
              framework: next,
              modules: --auth better-auth --jobs pg-boss,
              mail-api: "",
            }
          - {
              infra: neon,
              framework: tanstack-start,
              modules: --auth better-auth --jobs pg-boss,
              mail-api: "",
            }
          - {
              infra: supabase,
              framework: next,
              modules: --auth supabase --storage supabase --jobs pg-boss,
              mail-api: "http://127.0.0.1:55424",
            }
          - {
              infra: supabase,
              framework: tanstack-start,
              modules: --auth supabase --storage supabase --jobs pg-boss,
              mail-api: "http://127.0.0.1:55424",
            }
          # A frontend and its API: Better Auth in the frontend's server, the rest in the API.
          # Better Auth's emails go through the email module to Mailpit.
          - {
              infra: docker,
              framework: vite,
              api: hono,
              modules: --auth better-auth --email smtp --observability otel --payments stripe,
              mail-api: "http://127.0.0.1:8025",
            }
          - {
              infra: docker,
              framework: vite,
              api: hono,
              modules: --auth better-auth --observability sentry,
              mail-api: "",
            }
          # Each jobs provider, run by the API: a worker for pg-boss and BullMQ, and Inngest's Dev
          # Server calling the API through the frontend.
          - {
              infra: docker,
              framework: vite,
              api: hono,
              modules: --auth better-auth --jobs pg-boss,
              mail-api: "",
            }
          - {
              infra: docker,
              framework: vite,
              api: hono,
              modules: --auth better-auth --jobs bullmq,
              mail-api: "",
            }
          - {
              infra: docker,
              framework: vite,
              api: hono,
              modules: --auth better-auth --jobs inngest,
              mail-api: "",
            }
          # The API's files in a local folder (STORAGE_DIRECTORY) instead of S3.
          - {
              infra: local,
              framework: vite,
              api: hono,
              modules: --auth better-auth --jobs pg-boss,
              mail-api: "",
            }
          # The FastAPI API: its files in the Docker S3 service, then in a local folder; its email
          # goes to Mailpit, or to the log in local mode.
          - {
              infra: docker,
              framework: vite,
              api: fastapi,
              modules: --auth better-auth --storage s3 --email smtp,
              mail-api: "http://127.0.0.1:8025",
            }
          - {
              infra: local,
              framework: vite,
              api: fastapi,
              modules: --auth better-auth --storage s3 --email smtp,
              mail-api: "",
            }
    env:
      CLI_REF: ${{ inputs.cli-ref || 'main' }}
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
      E2E_AUTH_FLOW: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
        if: matrix.api == 'fastapi'
      - name: Build create-clubedge-app
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$CLI_REF" https://github.com/Clubedge/create-clubedge-app.git "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Generate the project
        run: |
          node "$RUNNER_TEMP/cli/bin/create.mjs" "$RUNNER_TEMP/generated-app" --template-dir "$GITHUB_WORKSPACE" \
            --framework ${{ matrix.framework }} --api ${{ matrix.api || 'none' }} --infra ${{ matrix.infra }} ${{ matrix.modules }} --no-git --no-install --yes
      - name: Install
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm install --frozen-lockfile
          if [ "${{ matrix.api }}" = fastapi ]; then (cd apps/api && uv sync --locked); fi
      # Better Auth checks that requests come from its own origin, which the browser tests reach
      # as 127.0.0.1; the frontend's server hosts it, and the API asks it for sessions there.
      - name: Serve Better Auth at the browser tests' origin
        if: matrix.framework == 'vite'
        run: echo "BETTER_AUTH_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
      - name: Move Supabase services to unused CI ports
        if: matrix.infra == 'supabase'
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          sed -i \
            -e 's/^port = 54321$/port = 55421/' \
            -e 's/^port = 54322$/port = 55422/' \
            -e 's/^port = 54323$/port = 55423/' \
            -e 's/^port = 54324$/port = 55424/' \
            -e 's/^smtp_port = 54325$/smtp_port = 55425/' \
            supabase/config.toml
      - name: Start the local services
        working-directory: ${{ runner.temp }}/generated-app
        if: matrix.infra != 'neon'
        run: |
          if [ "${{ matrix.infra }}" != local ]; then
            if [ "${{ matrix.infra }}" = supabase ]; then
              for attempt in 1 2 3; do
                if pnpm infra:up; then exit 0; fi
                pnpm infra:down || true
                sleep $((attempt * 10))
              done
              exit 1
            fi
            pnpm infra:up
            exit 0
          fi
          # The local database runs in the foreground, so keep it running for the next steps.
          nohup pnpm infra:up > "$RUNNER_TEMP/local-db.log" 2>&1 &
          timeout 180 bash -c 'until grep -q "Local database ready" "$RUNNER_TEMP/local-db.log"; do sleep 1; done'             || { cat "$RUNNER_TEMP/local-db.log"; exit 1; }
      - name: Start the Firebase Auth Emulator
        if: contains(matrix.modules, '--auth firebase')
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          nohup npx --yes firebase-tools@15 emulators:start --only auth --project demo-clubedge \
            > "$RUNNER_TEMP/firebase.log" 2>&1 &
          timeout 240 bash -c 'until curl --silent --output /dev/null http://127.0.0.1:9099/; do sleep 2; done' \
            || { cat "$RUNNER_TEMP/firebase.log"; exit 1; }
      - name: Use the local Supabase keys
        if: matrix.infra == 'supabase'
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          set -euo pipefail
          eval "$(npx --yes supabase@2 status -o env)"
          key="${PUBLISHABLE_KEY:-$ANON_KEY}"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$key"
            echo "DATABASE_URL=$DB_URL"
            # `supabase/config.toml` moves Inbucket's SMTP listener to 55425 alongside
            # the other Supabase ports; the generated .env.local still has the default 54325.
            echo "SMTP_URL=smtp://127.0.0.1:55425"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key"
            # Lets the settings page delete accounts.
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          } >> "$GITHUB_ENV"
      - name: Point at the database
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          if [ "${{ matrix.infra }}" = neon ]; then
            set -euo pipefail
            # The database create-clubedge-app wrote into the env file, or else (a CLI without Neon
            # support) one created here through Neon's API for unclaimed databases.
            url=$(sed -n 's/^DATABASE_URL=\(postgres[^ ]*\).*/\1/p' apps/web/.env.local | head -n 1)
            if [ -z "$url" ]; then
              api=https://claimable.neon.tech/v1
              identity=$(curl --fail --silent --show-error --request POST "$api/agent/identity" \
                --header 'content-type: application/json' \
                --data '{"type":"anonymous","capabilities":["postgres"],"source":"clubedge-starter-ci"}')
              project=$(jq -r .project.id <<< "$identity")
              token=$(curl --fail --silent --show-error --request POST "$api/oauth2/token" \
                --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
                --data-urlencode "assertion=$(jq -r .identity_assertion <<< "$identity")" \
                --data-urlencode resource=https://claimable.neon.tech/ | jq -r .access_token)
              url=$(curl --fail --silent --show-error "$api/projects/$project/credentials" \
                --header "authorization: Bearer $token" | jq -r .database_url)
            fi
            # The direct URL is the pooled one without -pooler in the host.
            direct=$(sed -E 's/(@[^.@/]+)-pooler\./\1./' <<< "$url")
            echo "::add-mask::$url"
            echo "::add-mask::$direct"
            case "$url" in *-pooler.*) ;; *) echo "Expected a pooled Neon URL"; exit 1 ;; esac
            echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
            echo "DATABASE_URL_DIRECT=$direct" >> "$GITHUB_ENV"
          elif [ "${{ matrix.infra }}" = supabase ]; then
            : # DATABASE_URL comes from `supabase status -o env` above.
          elif [ "${{ matrix.infra }}" = local ]; then
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/postgres" >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/app" >> "$GITHUB_ENV"
          fi
      - name: Migrate and check every service
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm db:migrate
          pnpm check:services
      # The AuthProvider conformance suite against the real local Supabase Auth and its inbox.
      - name: Run the auth conformance suite against Supabase
        if: matrix.infra == 'supabase'
        working-directory: ${{ runner.temp }}/generated-app
        env:
          SUPABASE_INBOX_URL: ${{ matrix.mail-api }}
        run: pnpm exec vitest run packages/auth-supabase
      # Inngest runs the jobs, auth emails included, by calling the app: its Dev Server must run
      # next to the app's dev server, which Playwright starts on port 3000.
      - name: Start the Inngest Dev Server
        if: contains(matrix.modules, '--jobs inngest')
        run: |
          set -euo pipefail
          nohup npx --yes --ignore-scripts=false inngest-cli@latest dev \
            > "$RUNNER_TEMP/inngest.log" 2>&1 &
          timeout 180 bash -c 'until curl --silent --fail --output /dev/null http://127.0.0.1:8288/; do sleep 2; done' \
            || { cat "$RUNNER_TEMP/inngest.log"; exit 1; }
      - name: Sign up, out, and in, reset a password through the emailed link, and check readiness
        working-directory: ${{ runner.temp }}/generated-app
        env:
          E2E_MAIL_API: ${{ matrix.mail-api }}
          E2E_DATABASE: "1"
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e e2e/auth-flow.spec.ts e2e/password-reset.spec.ts e2e/ready.spec.ts \
            e2e/settings.spec.ts
      - name: Run a background job (the dev server's worker, or Inngest)
        if: contains(matrix.modules, '--jobs')
        working-directory: ${{ runner.temp }}/generated-app
        env:
          E2E_DATABASE: "1"
        run: pnpm test:e2e e2e/jobs.spec.ts
      - name: Show the Inngest Dev Server's log
        if: failure() && contains(matrix.modules, '--jobs inngest')
        run: tail -n 100 "$RUNNER_TEMP/inngest.log" || true
      # Starts the app again and syncs it by hand, printing each answer, to show why Inngest found
      # no functions.
      - name: Show how the app syncs with Inngest
        if: failure() && contains(matrix.modules, '--jobs inngest')
        working-directory: ${{ runner.temp }}/generated-app
        env:
          APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          FRONTEND_URL: http://127.0.0.1:3000
        run: |
          nohup pnpm dev > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 90); do curl --silent --fail --output /dev/null http://127.0.0.1:3000/api/health && break; sleep 2; done
          echo "::group::GET /api/inngest"; curl --silent --show-error --include http://127.0.0.1:3000/api/inngest | head -c 3000; echo; echo "::endgroup::"
          echo "::group::PUT /api/inngest"; curl --silent --show-error --include --request PUT http://127.0.0.1:3000/api/inngest | head -c 3000; echo; echo "::endgroup::"
          sleep 10
          echo "::group::GET localhost:3000 (as the Dev Server resolves it)"; curl --silent --show-error --include http://localhost:3000/api/inngest | head -c 600; echo; echo "::endgroup::"
          echo "::group::Dev Server log"; tail -n 40 "$RUNNER_TEMP/inngest.log"; echo "::endgroup::"
          echo "::group::App log"; tail -n 80 "$RUNNER_TEMP/app.log"; echo "::endgroup::"
      # Request traces to e2e/telemetry-fake.ts, a stand-in for an OpenTelemetry collector and for
      # Sentry; each project reads only its own provider's variables.
      - name: Send request traces to the observability provider
        if: contains(matrix.modules, '--observability')
        working-directory: ${{ runner.temp }}/generated-app
        env:
          E2E_OBSERVABILITY: "1"
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4319
          SENTRY_DSN: http://public@127.0.0.1:4319/1
          SENTRY_TRACES_SAMPLE_RATE: "1"
        run: pnpm test:e2e e2e/observability.spec.ts
      - name: Sign in only after confirming the email address
        if: matrix.infra == 'docker' && matrix.mail-api != '' && contains(matrix.modules, '--auth better-auth')
        working-directory: ${{ runner.temp }}/generated-app
        env:
          E2E_MAIL_API: ${{ matrix.mail-api }}
          E2E_EMAIL_VERIFICATION: "1"
          BETTER_AUTH_REQUIRE_EMAIL_VERIFICATION: "true"
        run: pnpm test:e2e e2e/email-verification.spec.ts
      # Checkout, the webhook, and the portal against e2e/stripe-fake.ts, a stand-in for the
      # Stripe API; webhooks are signed with the secret below, as Stripe signs them.
      - name: Subscribe through checkout and the webhook, then open the billing portal
        if: matrix.infra == 'docker' && contains(matrix.modules, '--payments stripe')
        working-directory: ${{ runner.temp }}/generated-app
        env:
          E2E_PAYMENTS: "1"
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci_only
          STRIPE_PRICE_PRO: price_ci_pro
          STRIPE_API_BASE: http://127.0.0.1:12111
        run: pnpm test:e2e e2e/payments.spec.ts
      - name: Restart the local database and keep its data
        if: matrix.infra == 'local'
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          set -euo pipefail
          # Stop it the way Ctrl+C does, which closes PGlite cleanly.
          fuser -k -INT 5433/tcp
          timeout 30 bash -c 'while (echo > /dev/tcp/127.0.0.1/5433) 2>/dev/null; do sleep 1; done'
          nohup pnpm infra:up > "$RUNNER_TEMP/local-db-restart.log" 2>&1 &
          timeout 120 bash -c 'until grep -q "Local database ready" "$RUNNER_TEMP/local-db-restart.log"; do sleep 1; done'             || { cat "$RUNNER_TEMP/local-db-restart.log"; exit 1; }
          # The user signed up by the browser test is still there.
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from auth_user')" -ge 1
      - name: Stop the local services
        if: always()
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          if [ "${{ matrix.infra }}" = local ]; then fuser -k -INT 5433/tcp || true; else pnpm infra:down || true; fi
      # Failed browser tests: print each one's page snapshot here and keep traces and screenshots.
      - name: Show why browser tests failed
        if: failure()
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          find test-results -name error-context.md 2>/dev/null | while read -r file; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-local-infra-${{ matrix.infra }}-${{ matrix.framework }}-${{ matrix.api || 'none' }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/generated-app/test-results
          if-no-files-found: ignore
