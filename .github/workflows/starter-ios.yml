# Maintainer check for the Starter repository: a generated project's mobile apps, the shell and
# the native app, built for the iOS Simulator. macOS runners cost more than Linux ones, so it
# runs weekly and by hand; the Starter workflow builds the Android apps on every pull request.
name: Starter iOS
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      cli-ref:
        description: create-clubedge-app branch or tag used to generate projects
        default: main
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CLI_REF: ${{ inputs.cli-ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Build create-clubedge-app
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$CLI_REF" https://github.com/Clubedge/create-clubedge-app.git "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Generate the project
        run: |
          node "$RUNNER_TEMP/cli/bin/create.mjs" "$RUNNER_TEMP/generated-app" --template-dir "$GITHUB_WORKSPACE" \
            --framework vite --api hono --auth better-auth --shell capacitor --no-git --no-install --yes
      - name: Install
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm install --frozen-lockfile
      # Capacitor creates the Xcode project, with Swift Package Manager, and copies the app's build
      # into it. A Simulator build needs no signing.
      - name: Build the mobile app for the iOS Simulator
        working-directory: ${{ runner.temp }}/generated-app
        env:
          WEB_URL: https://example.com
        run: |
          set -euo pipefail
          pnpm --filter @clubedge/shell run sync ios
          cd apps/shell/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
  # The native app: Expo generates the Xcode project from app.config.ts and installs its pods.
  expo-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CLI_REF: ${{ inputs.cli-ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Build create-clubedge-app
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$CLI_REF" https://github.com/Clubedge/create-clubedge-app.git "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Generate the project
        run: |
          node "$RUNNER_TEMP/cli/bin/create.mjs" "$RUNNER_TEMP/generated-app" --template-dir "$GITHUB_WORKSPACE" \
            --framework vite --api hono --auth better-auth --mobile expo --no-git --no-install --yes
      - name: Install
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm install --frozen-lockfile
      # A Simulator build needs no signing.
      - name: Build the native app for the iOS Simulator
        working-directory: ${{ runner.temp }}/generated-app/apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://example.com
        run: |
          set -euo pipefail
          pnpm exec expo prebuild --platform ios
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          xcodebuild -workspace "$workspace" -scheme "$(basename "$workspace" .xcworkspace)" \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
