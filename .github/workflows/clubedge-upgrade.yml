name: Starter upgrade

# Checks every Monday for a newer Clubedge Starter release. When there is one, it runs
# `pnpm clubedge upgrade` and opens a pull request with the release notes and anything left for
# you to resolve, so your CI tests the upgrade before you merge it. Run it by hand from the
# Actions tab, or delete this file to turn it off.
#
# It needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull
# requests", or a CLUBEDGE_UPGRADE_TOKEN secret (a fine-grained token with contents and pull
# requests write), which also lets the pull request start your CI by itself.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: clubedge-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    # The Starter's own repository is the template every project comes from, not a project.
    if: github.repository != 'Clubedge/clubedge-starter'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Upgrade to the newest Starter release
        id: upgrade
        shell: bash
        run: |
          # A field of `clubedge` in package.json, read with fs: while a package.json has conflict
          # markers, require() fails for every file in the project, and pnpm cannot read it. After
          # an upgrade that left them, the Starter's version saved in .clubedge/incoming has the
          # new values; pass it as the fallback.
          starter_field() {
            node -e '
              const fs = require("node:fs");
              const [field, fallback] = process.argv.slice(1);
              const read = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
              let manifest;
              try {
                manifest = read("package.json");
              } catch (error) {
                if (!fallback) {
                  console.error(`package.json could not be read (${error.message}). Fix it on the default branch, then run this workflow again.`);
                  process.exit(1);
                }
                try {
                  manifest = read(fallback);
                } catch {
                  console.error(`Neither package.json nor ${fallback} could be read after the upgrade.`);
                  process.exit(1);
                }
              }
              console.log(manifest.clubedge?.[field] ?? "");
            ' "$@"
          }

          before=$(starter_field starterRef)
          if [ -z "$before" ]; then
            echo "package.json records no Starter release: this project was not created by create-clubedge-app."
            exit 1
          fi
          # The newest CLI upgrades to the Starter release it is pinned to. With
          # --detailed-exit-code it exits with 2 when the upgrade left conflicts to resolve, which
          # the pull request lists; any other failure stops here.
          status=0
          pnpm dlx @clubedge/create-clubedge-app@latest upgrade --no-install --detailed-exit-code 2>&1 | tee "$RUNNER_TEMP/upgrade.log" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "The upgrade failed (exit code $status); nothing was pushed."
            exit "$status"
          fi
          after=$(starter_field starterRef .clubedge/incoming/package.json)
          repository=$(starter_field starterRepository .clubedge/incoming/package.json)
          if [ "$after" = "$before" ] && [ -z "$(git status --porcelain)" ]; then
            echo "Already on the newest Starter release, $before."
            exit 0
          fi
          branch="clubedge/upgrade-$after"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists: its pull request is open, or was closed on purpose."
            exit 0
          fi
          conflicts=""
          if [ "$status" -eq 2 ]; then conflicts=$(git grep -l --untracked '^<<<<<<< yours' -- . || true); fi
          # The lockfile follows the upgraded package.json files. pnpm cannot read one with
          # conflict markers, so the install waits until they are resolved.
          if printf '%s\n' "$conflicts" | grep -qE '(^|/)package\.json$'; then
            install="skipped"
          else
            install="updated"
            pnpm install --no-frozen-lockfile >"$RUNNER_TEMP/install.log" 2>&1 || install="failed"
          fi
          printf '%s\n' "$conflicts" | sed '/^$/d' >"$RUNNER_TEMP/conflicts.txt"
          {
            echo "before=$before"
            echo "after=$after"
            echo "repository=${repository:-Clubedge/clubedge-starter}"
            echo "branch=$branch"
            echo "install=$install"
            if [ -d .clubedge/incoming ]; then echo "incoming=true"; fi
          } >>"$GITHUB_OUTPUT"
      - name: Keep the Starter's versions of conflicted files
        if: steps.upgrade.outputs.incoming == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: starter-versions
          path: .clubedge/incoming/
          include-hidden-files: true
      - name: Open the pull request
        if: steps.upgrade.outputs.branch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CLUBEDGE_UPGRADE_TOKEN || github.token }}
          OWN_TOKEN: ${{ secrets.CLUBEDGE_UPGRADE_TOKEN != '' }}
          BEFORE: ${{ steps.upgrade.outputs.before }}
          AFTER: ${{ steps.upgrade.outputs.after }}
          REPOSITORY: ${{ steps.upgrade.outputs.repository }}
          BRANCH: ${{ steps.upgrade.outputs.branch }}
          INSTALL: ${{ steps.upgrade.outputs.install }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The pull request's text is written before anything is pushed: it reads nothing from
          # the upgraded files, whose package.json may have conflict markers.
          conflicts=$(cat "$RUNNER_TEMP/conflicts.txt")
          {
            echo "Upgrades this project from Clubedge Starter \`$BEFORE\` to [\`$AFTER\`](https://github.com/$REPOSITORY/releases/tag/$AFTER), with \`pnpm clubedge upgrade\`. Your own edits are merged in; files you never changed take the new version."
            echo
            if [ -n "$conflicts" ]; then
              echo "### Conflicts to resolve"
              echo
              echo "These files have lines both you and the Starter changed, marked \`<<<<<<< yours\` ... \`>>>>>>> clubedge\`. Keep your lines, the Starter's, or a mix, then delete the markers:"
              echo
              printf -- '- `%s`\n' $conflicts
              echo
              echo "The Starter's whole new version of each is in the **starter-versions** artifact of [the run]($RUN_URL), to compare with yours."
              echo
            fi
            if [ "$INSTALL" = "skipped" ]; then
              echo "### pnpm install"
              echo
              echo "\`pnpm install\` did not run: pnpm cannot read a \`package.json\` with conflict markers, so \`pnpm-lock.yaml\` and \`pnpm clubedge\` wait for them. Resolve the conflicts in the \`package.json\` files above, then run \`pnpm install\` and commit \`pnpm-lock.yaml\`."
              echo
            elif [ "$INSTALL" = "failed" ]; then
              echo "### pnpm install"
              echo
              echo "\`pnpm install\` did not complete on the upgraded project, so \`pnpm-lock.yaml\` is not updated. Run \`pnpm install\` to see why, then commit \`pnpm-lock.yaml\`."
              echo
            fi
            echo "### Before merging"
            echo
            echo "- Read the [release notes](https://github.com/$REPOSITORY/releases/tag/$AFTER) for anything to do by hand."
            echo "- Run \`pnpm db:migrate\` for new migrations, and your tests."
            echo
            echo "<details><summary>Upgrade output</summary>"
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/upgrade.log"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Opened by the Starter upgrade workflow (\`.github/workflows/clubedge-upgrade.yml\`)."
          } >"$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add --all
          git commit --quiet --message "chore: upgrade to Clubedge Starter $AFTER"
          git push --quiet --set-upstream origin "$BRANCH"
          # A pushed branch without its pull request would make every later run skip this release,
          # so it is deleted for the next run to try again.
          if ! gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "chore: upgrade to Clubedge Starter $AFTER" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::The pull request could not be opened, so $BRANCH is deleted and the next run tries again."
            git push --quiet origin --delete "$BRANCH" || echo "::warning::Delete $BRANCH by hand, or later runs skip $AFTER."
            exit 1
          fi
          # Pull requests opened with the default token start no workflows: start CI on the branch.
          if [ "$OWN_TOKEN" != "true" ] && [ -f .github/workflows/ci.yml ]; then
            gh workflow run ci.yml --ref "$BRANCH" || echo "Start CI on $BRANCH by hand."
          fi
