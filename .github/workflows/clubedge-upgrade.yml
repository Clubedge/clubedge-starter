name: Starter upgrade

# Checks every Monday for a newer Clubedge Starter release. When there is one, it runs
# `pnpm clubedge upgrade`, which merges the release into your code and updates pnpm-lock.yaml
# without installing anything or running the project's scripts, and opens a pull request with
# the release notes and anything left for you to resolve, so your CI tests the upgrade before you
# merge it. Run it by hand from the Actions tab, or delete this file to turn it off.
#
# It needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull
# requests", or a CLUBEDGE_UPGRADE_TOKEN secret (a fine-grained token with contents and pull
# requests write), which also lets the pull request start your CI by itself.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: clubedge-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    # The Starter's own repository is the template every project comes from, not a project.
    if: github.repository != 'Clubedge/clubedge-starter'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Upgrade to the newest Starter release
        id: upgrade
        shell: bash
        env:
          # Raises GitHub's rate limit for the list of releases the upgrade crosses.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The newest CLI upgrades to the Starter release it is pinned to. It prints a JSON report
          # of the change on stdout and its log on stderr. --lockfile-only updates pnpm-lock.yaml
          # without installing anything or running the project's scripts: your CI installs and
          # tests the pull request. With --detailed-exit-code, an upgrade that left conflicts to
          # resolve exits with 2, which the pull request lists.
          status=0
          pnpm dlx @clubedge/create-clubedge-app@latest upgrade --json --lockfile-only --detailed-exit-code \
            >"$RUNNER_TEMP/report.json" 2>"$RUNNER_TEMP/upgrade.log" || status=$?
          cat "$RUNNER_TEMP/upgrade.log"

          # Writes what the pull request needs from the report into files in $RUNNER_TEMP, and the
          # step's outputs. It reads nothing from the upgraded files, whose package.json may have
          # conflict markers.
          node - "$RUNNER_TEMP" "$status" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [temp, status] = process.argv.slice(2);
          const fail = (message) => {
            console.log(message);
            process.exit(1);
          };
          let report;
          try {
            report = JSON.parse(fs.readFileSync(path.join(temp, "report.json"), "utf8"));
          } catch {
            fail(`The upgrade printed no report (exit code ${status}); nothing was pushed. Its log is above.`);
          }
          const write = (name, text) => fs.writeFileSync(path.join(temp, name), text);
          const outputs = [];
          if (report.outcome === "unchanged") {
            console.log(`Already on the newest Starter release, ${report.from?.ref}.`);
            process.exit(0);
          }
          // Files written before the lockfile could follow still make a pull request, which says so.
          if (report.outcome === "failed" && !(report.files?.length && report.install?.status === "failed")) {
            fail(`The upgrade failed: ${report.error?.message ?? `exit code ${status}`} Nothing was pushed.`);
          }
          const conflicts = report.files.filter((file) => file.action === "conflict").map((file) => file.path);
          write("conflicts.txt", conflicts.map((file) => `${file}\n`).join(""));
          write("install-reason.txt", report.install?.reason ?? "");
          write(
            "releases.md",
            (report.releases ?? []).map((release) => `- [\`${release.tag}\`](${release.url})${release.headings.length ? `: ${release.headings.join(", ")}` : ""}\n`).join(""),
          );
          const item = (text) => `- ${text.replaceAll("\n", "\n  ")}\n`;
          // The install's reason has its own section, and the release notes their link.
          write("warnings.md", report.warnings.filter((warning) => warning !== report.install?.reason).map(item).join(""));
          write("notes.md", report.notes.filter((note) => !note.startsWith("Release notes: ")).map(item).join(""));
          const install = { done: "updated", failed: "failed" }[report.install?.status] ?? "skipped";
          outputs.push(
            `before=${report.from.ref}`,
            `after=${report.to.ref}`,
            `repository=${report.to.repository}`,
            `branch=clubedge/upgrade-${report.to.ref}`,
            `install=${install}`,
          );
          if (report.files.some((file) => file.incoming)) outputs.push("incoming=true");
          write("outputs.txt", outputs.map((line) => `${line}\n`).join(""));
          NODE
          [ -f "$RUNNER_TEMP/outputs.txt" ] || exit 0
          branch=$(sed -n 's/^branch=//p' "$RUNNER_TEMP/outputs.txt")
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists: its pull request is open, or was closed on purpose."
            exit 0
          fi
          cat "$RUNNER_TEMP/outputs.txt" >>"$GITHUB_OUTPUT"
      - name: Keep the Starter's versions of conflicted files
        if: steps.upgrade.outputs.incoming == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: starter-versions
          path: .clubedge/incoming/
          include-hidden-files: true
      - name: Open the pull request
        if: steps.upgrade.outputs.branch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CLUBEDGE_UPGRADE_TOKEN || github.token }}
          OWN_TOKEN: ${{ secrets.CLUBEDGE_UPGRADE_TOKEN != '' }}
          BEFORE: ${{ steps.upgrade.outputs.before }}
          AFTER: ${{ steps.upgrade.outputs.after }}
          REPOSITORY: ${{ steps.upgrade.outputs.repository }}
          BRANCH: ${{ steps.upgrade.outputs.branch }}
          INSTALL: ${{ steps.upgrade.outputs.install }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The pull request's text is written before anything is pushed, from what the upgrade
          # step kept of its report.
          conflicts=$(cat "$RUNNER_TEMP/conflicts.txt")
          reason=$(cat "$RUNNER_TEMP/install-reason.txt")
          {
            echo "Upgrades this project from Clubedge Starter \`$BEFORE\` to [\`$AFTER\`](https://github.com/$REPOSITORY/releases/tag/$AFTER), with \`pnpm clubedge upgrade\`. Your own edits are merged in; files you never changed take the new version."
            echo
            if [ -n "$conflicts" ]; then
              echo "### Conflicts to resolve"
              echo
              echo "These files have lines both you and the Starter changed, marked \`<<<<<<< yours\` ... \`>>>>>>> clubedge\`. Keep your lines, the Starter's, or a mix, then delete the markers:"
              echo
              printf -- '- `%s`\n' $conflicts
              echo
              echo "The Starter's whole new version of each is in the **starter-versions** artifact of [the run]($RUN_URL), to compare with yours."
              echo
            fi
            if [ "$INSTALL" = "skipped" ]; then
              echo "### pnpm-lock.yaml"
              echo
              if printf '%s\n' "$conflicts" | grep -qE '(^|/)package\.json$'; then
                echo "\`pnpm-lock.yaml\` is not updated: pnpm cannot read a \`package.json\` with conflict markers, so \`pnpm-lock.yaml\` and \`pnpm clubedge\` wait for them. Resolve the conflicts in the \`package.json\` files above, then run \`pnpm install\` and commit \`pnpm-lock.yaml\`."
              else
                echo "\`pnpm-lock.yaml\` is not updated. $reason"
              fi
              echo
            elif [ "$INSTALL" = "failed" ]; then
              echo "### pnpm-lock.yaml"
              echo
              echo "\`pnpm-lock.yaml\` could not follow the upgrade: ${reason:-pnpm failed.} Run \`pnpm install\` to see why, then commit \`pnpm-lock.yaml\`."
              echo
            fi
            if [ -s "$RUNNER_TEMP/warnings.md" ]; then
              echo "### Warnings"
              echo
              cat "$RUNNER_TEMP/warnings.md"
              echo
            fi
            if [ -s "$RUNNER_TEMP/releases.md" ]; then
              echo "### Starter releases in this upgrade"
              echo
              cat "$RUNNER_TEMP/releases.md"
              echo
            fi
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              echo "### Notes"
              echo
              cat "$RUNNER_TEMP/notes.md"
              echo
            fi
            echo "### Before merging"
            echo
            echo "- Read the [release notes](https://github.com/$REPOSITORY/releases/tag/$AFTER) for anything to do by hand."
            echo "- Run \`pnpm db:migrate\` for new migrations, and your tests."
            echo
            echo "<details><summary>Upgrade output</summary>"
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/upgrade.log"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Opened by the Starter upgrade workflow (\`.github/workflows/clubedge-upgrade.yml\`)."
          } >"$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add --all
          git commit --quiet --message "chore: upgrade to Clubedge Starter $AFTER"
          git push --quiet --set-upstream origin "$BRANCH"
          # A pushed branch without its pull request would make every later run skip this release,
          # so it is deleted for the next run to try again.
          if ! gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "chore: upgrade to Clubedge Starter $AFTER" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::The pull request could not be opened, so $BRANCH is deleted and the next run tries again."
            git push --quiet origin --delete "$BRANCH" || echo "::warning::Delete $BRANCH by hand, or later runs skip $AFTER."
            exit 1
          fi
          # Pull requests opened with the default token start no workflows: start CI on the branch.
          if [ "$OWN_TOKEN" != "true" ] && [ -f .github/workflows/ci.yml ]; then
            gh workflow run ci.yml --ref "$BRANCH" || echo "Start CI on $BRANCH by hand."
          fi
