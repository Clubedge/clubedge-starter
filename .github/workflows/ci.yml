name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    # clubedge:if jobs=bullmq
    # Redis for the BullMQ provider's tests, which run the jobs conformance suite against it.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    # clubedge:end
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      UV_LOCKED: "1"
      REDIS_URL: redis://127.0.0.1:6379 # clubedge:only jobs=bullmq
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099 # clubedge:only auth=firebase
      FIREBASE_PROJECT_ID: demo-clubedge # clubedge:only auth=firebase
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Apps in other languages run their lint, typecheck, and tests with their own tools.
      - uses: astral-sh/setup-uv@v10.3.2
        if: ${{ hashFiles('apps/*/pyproject.toml') != '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # clubedge:if auth=firebase
      # Firebase's Auth Emulator (firebase.json), for the Firebase provider's conformance tests.
      - name: Start the Firebase Auth Emulator
        run: |
          nohup npx --yes firebase-tools@15 emulators:start --only auth --project demo-clubedge \
            > "$RUNNER_TEMP/firebase.log" 2>&1 &
          timeout 240 bash -c 'until curl --silent --output /dev/null http://127.0.0.1:9099/; do sleep 2; done' \
            || { cat "$RUNNER_TEMP/firebase.log"; exit 1; }
      # clubedge:end
      - run: pnpm test
      # clubedge:if framework!=none
      # Build the way the app is developed: with the env example copied into place.
      - run: cp .env.example apps/web/.env.local
      # clubedge:end
      # clubedge:if framework=none
      # Build the way the API is developed: with its env example copied into place.
      - run: cp apps/api/.env.example apps/api/.env.local
        if: github.repository != 'Clubedge/clubedge-starter' # clubedge:only starter-repository
      # clubedge:end
      - run: pnpm build
      # clubedge:if framework!=none
      - name: Serve the production build
        run: |
          set -euo pipefail
          pnpm start > "$RUNNER_TEMP/app.log" 2>&1 &
          trap 'tail -n 50 "$RUNNER_TEMP/app.log"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          for path in / /dashboard /api/health; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:3000$path"
          done
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/login # clubedge:only auth!=none
      # clubedge:end
      # clubedge:if framework=none
      # The Starter's own pnpm start serves its website, so only projects without one run this.
      - name: Serve the API's production build
        if: github.repository != 'Clubedge/clubedge-starter' # clubedge:only starter-repository
        run: |
          set -euo pipefail
          pnpm start > "$RUNNER_TEMP/api.log" 2>&1 &
          trap 'tail -n 50 "$RUNNER_TEMP/api.log"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://127.0.0.1:3001/api/health && break
            sleep 1
          done
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3001/api/health
      # clubedge:end
      # clubedge:if mobile!=none
      # package.json's pnpm.auditConfig skips two high advisories in Expo's development CLI
      # (@expo/cli), which builds and serves the native app but is not part of it: node-forge's,
      # which has no fixed release, and zod 3's, fixed only in zod 4. pnpm skips them wherever they
      # appear, so remove them once Expo's CLI no longer needs them. Last checked on 2026-10-26,
      # with @expo/cli 58.1.15.
      # clubedge:end
      - run: pnpm audit --audit-level high

  # clubedge:if framework!=none
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  # clubedge:end

  docker:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # clubedge:if api=none
      - name: Build the production image
        # A public URL of its own, to check that it reaches the build.
        run: docker build --build-arg NEXT_PUBLIC_APP_URL=https://app.ci.invalid --tag app:ci .
      # clubedge:end
      # clubedge:if api!=none && framework!=none
      # The frontend's image, and the API's, which owns the database and carries the migrator.
      # Their own tags: the Starter repository runs every block of this file.
      - name: Build the production images
        run: |
          set -euo pipefail
          docker build --tag web:ci .
          docker build --file apps/api/Dockerfile --tag api:ci .
      # clubedge:end
      # clubedge:if framework=none
      # The API's image, which owns the database and carries the migrator.
      - name: Build the production image
        if: github.repository != 'Clubedge/clubedge-starter' # clubedge:only starter-repository
        run: docker build --file apps/api/Dockerfile --tag api:ci .
      # clubedge:end
      # clubedge:if framework=next
      - name: Check that the public URL is compiled into the build
        # Next.js inlines NEXT_PUBLIC_* at build time, server code included; without the build
        # argument, sign-in links and Stripe return URLs would point at localhost.
        run: docker run --rm --entrypoint sh app:ci -c 'grep -rlq "https://app.ci.invalid" /app/apps/web/.next/server'
      # clubedge:end
      - name: Run the image's migrations twice; the second run changes nothing
        run: |
          set -euo pipefail
          for run in 1 2; do
            docker run --rm --network host               --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/app               app:ci node /app/migrate.mjs # clubedge:only api=none
            docker run --rm --network host --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/app api:ci node /app/migrate.mjs # clubedge:only api!=none
          done
          PGPASSWORD=postgres psql --host 127.0.0.1 --username postgres --dbname app             --command "select count(*) from public.users"
      # clubedge:if api=none
      - name: Start the image and check health
        run: |
          set -euo pipefail
          docker run --detach --name app --publish 3000:3000 \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            app:ci
          trap 'docker logs app; docker rm --force app' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The container did not become healthy."
          exit 1
      # clubedge:end
      # clubedge:if api!=none && framework!=none
      # On the host's network, like the migrations: the API on port 3001, and the frontend on
      # 3000, which forwards /api to it. Both must answer: the API itself, and through the frontend.
      - name: Start the images and check health through the frontend
        run: |
          set -euo pipefail
          docker run --detach --name api --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/app api:ci
          docker run --detach --name web --network host --env API_URL=http://127.0.0.1:3001 web:ci
          trap 'docker logs api; docker logs web; docker rm --force api web' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health &&
              curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The containers did not become healthy."
          exit 1
      # clubedge:end
      # clubedge:if framework=none
      # On the host's network, like the migrations: the API on port 3001, where the mobile app
      # calls it.
      - name: Start the API's image and check health
        if: github.repository != 'Clubedge/clubedge-starter' # clubedge:only starter-repository
        run: |
          set -euo pipefail
          docker run --detach --name api --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/app api:ci
          trap 'docker logs api; docker rm --force api' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The container did not become healthy."
          exit 1
      # clubedge:end

  # clubedge:if api!=none
  # Apps installed on phones keep calling the contract they shipped with, so a pull request must
  # not change packages/contract/openapi.yaml in a way that breaks them: removing or renaming an
  # operation or a field, or making an optional request field required. For a deliberate break
  # before any app has shipped, label the pull request breaking-contract and run this job again.
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The labels are read when the job runs, so a label added after the push counts too.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Read the base branch's contract
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '.labels[].name')
          if grep -qx breaking-contract <<<"$labels"; then
            echo "::notice::Labelled breaking-contract, so the contract is not compared."
            exit 0
          fi
          git fetch --no-tags --depth 1 origin "$BASE_SHA"
          if ! git cat-file -e "$BASE_SHA:packages/contract/openapi.yaml" 2>/dev/null; then
            echo "::notice::The base branch has no contract, so no installed app depends on it."
            exit 0
          fi
          git show "$BASE_SHA:packages/contract/openapi.yaml" > openapi.base.yaml
          echo "compare=true" >> "$GITHUB_OUTPUT"
      - name: Fail on changes that break existing clients
        if: steps.base.outputs.compare == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.20
        with:
          base: openapi.base.yaml
          revision: packages/contract/openapi.yaml
          fail-on: ERR
          # Compared in CI only: the contract is not uploaded to oasdiff.com.
          review: false
  # clubedge:end

  # clubedge:if shell!=none
  # The mobile app: the web app's build for it, copied into the Android project (which Capacitor
  # creates when the project has none yet), and a debug APK to try on a device.
  android:
    # The Starter's repository is the template projects come from, not one. # clubedge:only starter-repository
    if: github.repository != 'Clubedge/clubedge-starter' # clubedge:only starter-repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Capacitor 8 builds with Java 21; the runner has the Android SDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Build the debug APK
        env:
          # The website the app calls: set a WEB_URL repository variable for an APK that works.
          WEB_URL: ${{ vars.WEB_URL || 'https://example.com' }}
        run: |
          set -euo pipefail
          pnpm --filter @clubedge/shell run sync android
          cd apps/shell/android
          # A project committed from Windows has lost the executable bit.
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: apps/shell/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  # clubedge:end

  # clubedge:if mobile!=none
  # The native app: its packages against its Expo SDK, its JavaScript bundle for Android and iOS,
  # and a release APK, built from the Android project Expo generates from app.config.ts.
  expo:
    # The Starter's repository is the template projects come from, not one. # clubedge:only starter-repository
    if: github.repository != 'Clubedge/clubedge-starter' # clubedge:only starter-repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # The website the app calls: set an EXPO_PUBLIC_API_URL repository variable for an APK that works. # clubedge:only framework!=none
      # The API the app calls: set an EXPO_PUBLIC_API_URL repository variable for an APK that works. # clubedge:only framework=none
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://example.com' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # React Native builds with Java 17; the runner has the Android SDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo install --check
      - run: pnpm exec expo export --platform android --platform ios
      - name: Build the release APK
        run: |
          set -euo pipefail
          pnpm exec expo prebuild --platform android
          # The release build carries the app's JavaScript; Expo signs it with a debug key until
          # you set your own (SETUP.md, "The native app").
          cd android
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
  # clubedge:end
