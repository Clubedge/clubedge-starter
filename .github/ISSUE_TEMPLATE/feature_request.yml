name: Feature request
description: Suggest an improvement or capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the use case and who benefits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you have in mind. Alternatives are welcome.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Include links, examples, or constraints that would help evaluate the request.
