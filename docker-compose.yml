services:
  app: # clubedge:only framework!=none
    build: # clubedge:only framework!=none
      context: . # clubedge:only framework!=none
      # clubedge:if framework=vite
      # Vite compiles its VITE_* settings into the build, and .env files stay out of the image:
      # Compose reads these from the shell or a .env file next to this one (or pass
      # --env-file apps/web/.env.local).
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-} # clubedge:only auth=supabase
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-} # clubedge:only auth=supabase
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-} # clubedge:only auth=firebase
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-} # clubedge:only auth=firebase
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-} # clubedge:only auth=firebase
        VITE_APPWRITE_ENDPOINT: ${VITE_APPWRITE_ENDPOINT:-} # clubedge:only auth=appwrite
        VITE_APPWRITE_PROJECT_ID: ${VITE_APPWRITE_PROJECT_ID:-} # clubedge:only auth=appwrite
      # clubedge:end
    ports: # clubedge:only framework!=none
      - "3000:3000" # clubedge:only framework!=none
    env_file: # clubedge:only framework!=none
      - ./apps/web/.env.local # clubedge:only framework!=none
    # clubedge:if api!=none && framework!=none
    environment:
      # The frontend's server sends /api to the API service.
      API_URL: http://api:3001
    depends_on:
      - api
    # clubedge:end
    restart: unless-stopped # clubedge:only framework!=none
  # clubedge:if api!=none
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Without a website, the mobile app calls the API itself. # clubedge:only framework=none
    ports: # clubedge:only framework=none
      - "3001:3001" # clubedge:only framework=none
    env_file:
      - path: ./apps/api/.env.local
        required: false
    environment:
      HOST: 0.0.0.0
      # Only the frontend's server reaches the API (it publishes no port), and it sends the # clubedge:only framework!=none
      # client's address as the one X-Forwarded-For entry, for the API's rate limits. # clubedge:only framework!=none
      TRUSTED_PROXY_HOPS: "1" # clubedge:only framework!=none
    restart: unless-stopped
  # clubedge:end
