# Local Supabase stack for development: `pnpm infra:up` runs `supabase start`, and
# `pnpm infra:status` prints the local URLs and keys. Docs: https://supabase.com/docs/guides/local-development
project_id = "clubedge-app"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[studio]
port = 54323

# Captures sign-up and password emails locally; open it from `pnpm infra:status`.
[inbucket]
port = 54324
# clubedge:if email=smtp
# The app's own email goes to the same inbox over SMTP.
smtp_port = 54325
# clubedge:end

[auth]
# clubedge:if framework!=none
site_url = "http://localhost:3000"
# Patterns, so links can carry a next page, such as the password reset page.
additional_redirect_urls = ["http://localhost:3000/auth/callback**", "http://127.0.0.1:3000/auth/callback**"]
# clubedge:end
# clubedge:if framework=none
# Without a website, emailed links go to the address the client asks for once it is listed here,
# such as the native app's scheme, which apps/mobile/app.config.ts makes from the site config's
# serviceId ("my-product://**"). Restart the stack after changing it: pnpm infra:down, then
# pnpm infra:up. Other links go to site_url, the API.
site_url = "http://localhost:3001"
additional_redirect_urls = []
# clubedge:end

[auth.email]
# Sign-up signs the user in directly during local development.
enable_confirmations = false

# The local stack's default allows only a few emails an hour; tests and development send more.
[auth.rate_limit]
email_sent = 100

# clubedge:if storage=supabase
[storage.buckets.app]
public = false
# clubedge:end

# Not used by the app; disabled so the stack starts faster.
[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
