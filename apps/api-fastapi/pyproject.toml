[project]
name = "clubedge-api"
version = "0.30.0"
description = "The project's API, implementing packages/contract/openapi.yaml."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.146.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.1",
]
# One group per module option. Every project keeps them all, so uv.lock is the same everywhere;
# the production image installs only the selected ones (Dockerfile).
storage-s3 = ["boto3>=1.35"]
cache-redis = ["redis>=5.2"]
email-smtp = ["aiosmtplib>=3"]
observability-otel = [
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]
observability-sentry = ["sentry-sdk>=2.20"]
payments-stripe = ["stripe>=11"]
jobs-bullmq = ["bullmq>=2"]
jobs-inngest = ["inngest>=0.4"]
# FCM's service account and APNs' key sign their tokens; APNs answers over HTTP/2 only.
push-native = ["cryptography>=44", "h2>=4.1"]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clubedge_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
