[project]
name = "clubedge-api"
version = "0.24.2"
description = "The project's API, implementing packages/contract/openapi.yaml."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.146.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clubedge_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
