# Netlify (https://docs.netlify.com/configure-builds/file-based-configuration/). Set the site's
# base directory to apps/web; the build detects Netlify and writes its functions and assets.
[build]
  # check:env stops the build when a variable the project needs is unset; then migrations run,
  # against the DATABASE_URL set for the deploy context.
  command = "pnpm run check:env && pnpm --dir ../.. db:migrate && pnpm run build"
  publish = "dist"
